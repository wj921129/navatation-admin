server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,image/svg+xml
    min-response-size: 1024
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  application:
    name: navatation-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      # password:  # Redis 无密码时可留空
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  rsa:
    key-path: ./rsa
  upload:
    icon-path: ${APP_UPLOAD_ICON_PATH:../data/user_data/icon}
    wallpaper-path: ${APP_UPLOAD_WALLPAPER_PATH:../data/user_data/bg_custom}
    local-wallpaper-path: ${APP_UPLOAD_LOCAL_WALLPAPER_PATH:../data/sys_data/bg_img}
    sys-icon-path: ${APP_UPLOAD_SYS_ICON_PATH:../data/sys_data/icon}
  jwt:
    secret: navatation-jwt-secret-key-2026-must-be-at-least-256-bits-long
    access-token-expire: 7200
    refresh-token-expire: 604800

logging:
  level:
    com.navatation: DEBUG
