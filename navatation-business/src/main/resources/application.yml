server:
  port: 8080

spring:
  application:
    name: navatation-server
  datasource:
    url: jdbc:mysql://localhost:3306/navatation?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      # password:  # Redis 无密码时可留空
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  rsa:
    key-path: ./rsa
  jwt:
    secret: navatation-jwt-secret-key-2026-must-be-at-least-256-bits-long
    access-token-expire: 7200
    refresh-token-expire: 604800

logging:
  level:
    com.navatation: DEBUG
